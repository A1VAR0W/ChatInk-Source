name: chatink-preproduction

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatink_preproduction
      POSTGRES_USER: chatink_pre
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - app_internal

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.preproduction
      target: runtime
      args:
        VITE_SERVER_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL es obligatorio}
        VITE_PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL es obligatorio}
        VITE_UPDATE_MANIFEST_URL: https://chat-ink.tail552c89.ts.net:8443/preproduction-update.json
    image: chatink-preproduction:local
    user: "0:0"
    init: true
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    stop_grace_period: 20s
    tmpfs:
      - /tmp/chatink-preproduction:rw,noexec,nosuid,size=256m,uid=1000,gid=1000,mode=0700
    ports:
      - "127.0.0.1:3002:3001"
    volumes:
      - type: bind
        source: ${CHATINK_PREPRODUCTION_ARTIFACTS_DIR:-../release-artifacts}
        target: /app/apps/client/dist/preproduction-builds
        read_only: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      TOKEN_SECRET_FILE: /run/secrets/token_secret
      DATABASE_URL_FILE: /run/secrets/database_url
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS es obligatorio}
      TRUST_PROXY: "true"
      SERVE_CLIENT: "true"
      CLIENT_DIST: apps/client/dist
      TEMP_ROOT: /tmp/chatink-preproduction
      ROOM_EMPTY_TTL_MS: ${ROOM_EMPTY_TTL_MS:-300000}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-26214400}
      MIN_SUPPORTED_CLIENT_VERSION: ${MIN_SUPPORTED_CLIENT_VERSION:-0.0.0}
      LATEST_CLIENT_VERSION: ${LATEST_CLIENT_VERSION:-0.0.0}
      CLIENT_RELEASE_URL: ${CLIENT_RELEASE_URL:-https://github.com/A1VAR0W/ChatInk-Source/releases}
    secrets:
      - token_secret
      - database_url
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app_internal
      - edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  app_internal:
    internal: true
  edge:

volumes:
  postgres_data:

secrets:
  token_secret:
    file: ${CHATINK_PREPRODUCTION_SECRETS_DIR:?CHATINK_PREPRODUCTION_SECRETS_DIR es obligatorio}/token_secret
  database_password:
    file: ${CHATINK_PREPRODUCTION_SECRETS_DIR:?CHATINK_PREPRODUCTION_SECRETS_DIR es obligatorio}/database_password
  database_url:
    file: ${CHATINK_PREPRODUCTION_SECRETS_DIR:?CHATINK_PREPRODUCTION_SECRETS_DIR es obligatorio}/database_url
