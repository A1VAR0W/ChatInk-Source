name: ci

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install reproducible dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build

      - name: Validate home-server deployment files
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/install.sh deploy/update.sh
          docker compose --env-file deploy/.env.example -f deploy/compose.prod.yml config --quiet
          docker run --rm \
            --env APP_DOMAIN=chat.example.com \
            --env ACME_EMAIL=admin@example.com \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build production container
        run: docker build --tag pictochat-ci:${{ github.sha }} .

      - name: Smoke test production container
        shell: bash
        run: |
          set -euo pipefail
          token_secret="$(openssl rand -base64 48)"
          docker run \
            --detach \
            --name pictochat-ci \
            --read-only \
            --tmpfs /tmp/pictochat:rw,noexec,nosuid,size=256m,uid=10001,gid=10001,mode=0700 \
            --publish 3001:3001 \
            --env TOKEN_SECRET="$token_secret" \
            --env ALLOWED_ORIGINS=http://localhost:3001 \
            pictochat-ci:${{ github.sha }}

          cleanup() {
            docker logs pictochat-ci || true
            docker rm --force pictochat-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "El contenedor no alcanzó un estado saludable" >&2
          exit 1

  publish:
    name: Publish multi-arch image to GHCR
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
