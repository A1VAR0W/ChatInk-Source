name: ci

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install reproducible dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build

      - name: Build production container
        run: docker build --tag pictochat-ci:${{ github.sha }} .

      - name: Smoke test production container
        shell: bash
        run: |
          set -euo pipefail
          token_secret="$(openssl rand -base64 48)"
          docker run \
            --detach \
            --name pictochat-ci \
            --read-only \
            --tmpfs /tmp/pictochat:rw,noexec,nosuid,size=256m,uid=10001,gid=10001,mode=0700 \
            --publish 3001:3001 \
            --env TOKEN_SECRET="$token_secret" \
            --env ALLOWED_ORIGINS=http://localhost:3001 \
            pictochat-ci:${{ github.sha }}

          cleanup() {
            docker logs pictochat-ci || true
            docker rm --force pictochat-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "El contenedor no alcanzó un estado saludable" >&2
          exit 1
