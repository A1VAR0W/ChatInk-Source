name: android-builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - "codex/**"
    paths:
      - "apps/client/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-builder.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build and sign Android release APK + AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Use Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install reproducible dependencies
        run: npm ci

      - name: Build PWA
        run: npm run build:pwa
        env:
          VITE_SERVER_URL: ${{ vars.PUBLIC_SERVER_URL || 'https://chat-ink.tail552c89.ts.net' }}
          VITE_PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://chat-ink.tail552c89.ts.net' }}

      - name: Create and sync Capacitor Android project
        working-directory: apps/client
        run: |
          npx cap add android
          npx cap sync android
          npm run icons:apply:android

      - name: Make Gradle wrapper executable
        working-directory: apps/client/android
        run: chmod +x ./gradlew

      - name: Set Android release version
        shell: bash
        run: |
          set -euo pipefail
          gradle_file="apps/client/android/app/build.gradle"
          version_code="$GITHUB_RUN_NUMBER"
          version_name="0.1.0-${GITHUB_RUN_NUMBER}"

          sed -Ei "s/versionCode [0-9]+/versionCode ${version_code}/" "$gradle_file"
          sed -Ei "s/versionName \"[^\"]+\"/versionName \"${version_name}\"/" "$gradle_file"
          grep -Fq "versionCode ${version_code}" "$gradle_file"
          grep -Fq "versionName \"${version_name}\"" "$gradle_file"

      - name: Validate Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              missing+=("$secret_name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Faltan secretos de firma: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/chat-ink-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          chmod 600 "$keystore_path"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$keystore_path" >> "$GITHUB_ENV"

      - name: Build unsigned release APK and app bundle
        working-directory: apps/client/android
        run: ./gradlew clean assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Align and sign release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned_apk="apps/client/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned_apk="$RUNNER_TEMP/Chat-Ink-android-release-aligned.apk"
          signed_apk="Chat-Ink-android-release.apk"
          test -s "$unsigned_apk"

          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          zipalign_path="$build_tools_dir/zipalign"
          apksigner_path="$build_tools_dir/apksigner"
          test -x "$zipalign_path"
          test -x "$apksigner_path"

          "$zipalign_path" -P 16 -f -v 4 "$unsigned_apk" "$aligned_apk"
          "$apksigner_path" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed_apk" \
            "$aligned_apk"
          rm -f "$aligned_apk"

      - name: Sign release app bundle for Google Play
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned_aab="apps/client/android/app/build/outputs/bundle/release/app-release.aab"
          signed_aab="Chat-Ink-android-play-release.aab"
          test -s "$unsigned_aab"

          jarsigner \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -signedjar "$signed_aab" \
            "$unsigned_aab" \
            "$ANDROID_KEY_ALIAS"

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          signed_apk="Chat-Ink-android-release.apk"
          test -s "$signed_apk"
          unzip -l "$signed_apk" | grep -q 'AndroidManifest.xml'

          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          zipalign_path="$build_tools_dir/zipalign"
          apksigner_path="$build_tools_dir/apksigner"
          test -x "$zipalign_path"
          test -x "$apksigner_path"
          "$zipalign_path" -c -P 16 -v 4 "$signed_apk"
          "$apksigner_path" verify --verbose --print-certs "$signed_apk"
          sha256sum "$signed_apk" > "$signed_apk.sha256"

      - name: Verify app bundle signature and contents
        shell: bash
        run: |
          set -euo pipefail
          signed_aab="Chat-Ink-android-play-release.aab"
          test -s "$signed_aab"
          unzip -tq "$signed_aab"
          unzip -Z1 "$signed_aab" | grep -q '^base/manifest/AndroidManifest.xml$'
          unzip -Z1 "$signed_aab" | grep -Eq '^META-INF/[^/]+\.SF$'
          unzip -Z1 "$signed_aab" | grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC)$'
          jarsigner -verify -verbose -certs "$signed_aab"
          sha256sum "$signed_aab" > "$signed_aab.sha256"

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "${ANDROID_KEYSTORE_PATH:-$RUNNER_TEMP/chat-ink-release.keystore}"

      - name: Upload signed release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chat-Ink-Android-release
          path: |
            Chat-Ink-android-release.apk
            Chat-Ink-android-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Google Play app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Chat-Ink-Android-Play-release
          path: |
            Chat-Ink-android-play-release.aab
            Chat-Ink-android-play-release.aab.sha256
          if-no-files-found: error
          retention-days: 14
