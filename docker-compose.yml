name: pictochat-development

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    init: true
    ports:
      - "3001:3001"
      - "5173:5173"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3001
      TOKEN_SECRET: development-only-secret-change-me-now
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      TRUST_PROXY: "false"
      SERVE_CLIENT: "false"
      CLIENT_DIST: apps/client/dist
      TEMP_ROOT: /tmp/pictochat-development
      VITE_SERVER_URL: ""
      VITE_PUBLIC_APP_URL: http://localhost:5173
      VITE_MAX_FILE_BYTES: 26214400
    volumes:
      - .:/app
      - development_node_modules:/app/node_modules
    tmpfs:
      - /tmp/pictochat-development:rw,noexec,nosuid,size=256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  development_node_modules:
